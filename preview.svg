<svg xmlns="http://www.w3.org/2000/svg" viewBox="10 0 670 250" width="670" height="250">
  <!-- Inactive tabs (behind card) -->
  <path d="M256 58 L256 34 Q256 24 266 24 L342 24 Q352 24 352 34 L352 58"
        fill="#15202e" stroke="#334155" stroke-width="1"/>
  <path d="M360 58 L360 34 Q360 24 370 24 L446 24 Q456 24 456 34 L456 58"
        fill="#131c2a" stroke="#2d3d52" stroke-width="1"/>

  <!-- Main card -->
  <path d="M152 58 L572 58 Q582 58 582 68 L582 218 Q582 228 572 228 L162 228 Q152 228 152 218 Z"
        fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>

  <!-- Active tab -->
  <path d="M152 58 L152 34 Q152 24 162 24 L238 24 Q248 24 248 34 L248 58"
        fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
  <line x1="153" y1="58.5" x2="247" y2="58.5" stroke="#1e293b" stroke-width="3"/>

  <!-- Tab labels -->
  <text x="200" y="46" text-anchor="middle" font-family="monospace" font-size="14" fill="#60a5fa">default</text>
  <text x="304" y="46" text-anchor="middle" font-family="monospace" font-size="14" fill="#94a3b8">move</text>
  <text x="408" y="46" text-anchor="middle" font-family="monospace" font-size="14" fill="#7c8ca0">combat</text>

  <!-- Input nodes -->
  <circle cx="72" cy="112" r="22" fill="#0f172a" stroke="#3b82f6" stroke-width="2.5"/>
  <text x="72" y="117" text-anchor="middle" font-family="monospace" font-size="15" fill="#60a5fa">pop</text>
  <circle cx="72" cy="192" r="22" fill="#0f172a" stroke="#3b82f6" stroke-width="2.5"/>
  <text x="72" y="197" text-anchor="middle" font-family="monospace" font-size="15" fill="#60a5fa">hiss</text>

  <!-- pop → row -->
  <line x1="94" y1="112" x2="304" y2="112" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round"/>

  <!-- hiss → row -->
  <line x1="94" y1="192" x2="304" y2="192" stroke="#3b82f6" stroke-width="2.2" stroke-linecap="round" opacity="0.75"/>

  <!-- Output rows -->
  <rect x="304" y="93" width="250" height="38" rx="6" fill="#111827" stroke="#334155" stroke-width="0.8"/>
  <text x="320" y="117" font-family="monospace" font-size="15" fill="#60a5fa">pop</text>
  <text x="540" y="117" text-anchor="end" font-family="monospace" font-size="15" fill="#e5e7eb">jump</text>

  <rect x="304" y="173" width="250" height="38" rx="6" fill="#111827" stroke="#334155" stroke-width="0.8"/>
  <text x="320" y="197" font-family="monospace" font-size="15" fill="#60a5fa">hiss</text>
  <text x="540" y="197" text-anchor="end" font-family="monospace" font-size="15" fill="#e5e7eb">run</text>

  <!-- Output lines -->
  <line x1="554" y1="112" x2="612" y2="112" stroke="#60a5fa" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
  <line x1="554" y1="192" x2="612" y2="192" stroke="#3b82f6" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>

  <!-- Output dots -->
  <circle cx="624" cy="112" r="9" stroke="#60a5fa" stroke-width="1.5" fill="none" opacity="0.5"/>
  <circle cx="624" cy="112" r="3.5" fill="#60a5fa" opacity="0.6"/>
  <circle cx="624" cy="192" r="9" stroke="#3b82f6" stroke-width="1.5" fill="none" opacity="0.5"/>
  <circle cx="624" cy="192" r="3.5" fill="#3b82f6" opacity="0.6"/>
</svg>